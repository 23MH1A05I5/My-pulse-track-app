services:
  # ── Python rPPG Microservice (Docker) ────────────────────────────────────────
  - type: web
    name: pulsetrack-rppg
    runtime: docker
    dockerfilePath: ./python_rppg/Dockerfile
    dockerContext: ./python_rppg
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://23mh1a05i5.github.io,https://my-pulse-track-app.onrender.com,https://pulse-track-backend-1-bgfi.onrender.com

  # ── Flutter Web Frontend (Static Site) ──────────────────────────────────────
  - type: web
    name: pulse-track-frontend
    runtime: static
    buildCommand: |
      curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.32.0-stable.tar.xz -o flutter.tar.xz
      tar xf flutter.tar.xz
      export PATH="$PATH:$(pwd)/flutter/bin"
      flutter pub get
      flutter build web --release --base-href "/My-pulse-track-app/"
    staticPublishPath: build/web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: FLUTTER_VERSION
        value: "3.32.0"
